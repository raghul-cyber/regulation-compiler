version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: regulater-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: regulation_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: regulater-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: ../apps/api
      dockerfile: ../../infra/Dockerfile.api
    container_name: regulater-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/regulation_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - ENVIRONMENT=production
      - CORS_ORIGINS=*
      - PORT=8000
    depends_on:
      - db
      - redis
    restart: always

  worker:
    build:
      context: ../apps/api
      dockerfile: ../../infra/Dockerfile.worker
    container_name: regulater-worker
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/regulation_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - ENVIRONMENT=production
    depends_on:
      - db
      - redis
    restart: always

volumes:
  postgres_data:
  redis_data:
